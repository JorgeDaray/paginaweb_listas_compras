<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lista de Compras</title>
  <link rel="stylesheet" href="style.css" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  />
</head>
<body>
  <header>
    <button id="btnMenuToggle" aria-label="Abrir menú" title="Menú" aria-controls="mainNav" aria-expanded="false">
      <i class="fas fa-bars" aria-hidden="true"></i>
    </button>    
    <h1>Mi Lista de Compras</h1>
    <nav role="navigation" aria-label="Menú principal" id="mainNav">
      <button id="btnAgregar" onclick="mostrarSeccion('agregar')" aria-label="Agregar lista">
        <i class="fas fa-plus-circle" aria-hidden="true"></i> Agregar Lista
      </button>
      <button id="btnConsultar" onclick="mostrarSeccion('consultar')" aria-label="Consultar por tienda">
        <i class="fas fa-store" aria-hidden="true"></i> Consultar por Tienda
      </button>
      <button id="btnVerListas" onclick="mostrarSeccion('verListas')" aria-label="Ver listas">
        <i class="fas fa-list-ul" aria-hidden="true"></i> Ver Listas
      </button>
      <button id="btnNotificaciones" onclick="mostrarSeccion('notificaciones')" aria-label="Notificaciones">
        <i class="fas fa-bell" aria-hidden="true"></i> Notificaciones
      </button>
      <button id="btnEventos" onclick="mostrarSeccion('eventos')" aria-label="Eventos">
        <i class="fas fa-calendar-day" aria-hidden="true"></i> Eventos
      </button>
    </nav>
  </header>  
  <main>
    <!-- Sección Agregar Lista -->
    <section id="agregar" class="seccion">
      <h2 id="tituloFormulario">Agregar Lista de Compras</h2>
      <form id="formLista">
        <input type="hidden" id="idListaEditando" />
        <input type="text" id="lugar" placeholder="Lugar de compra" required />
        <input type="date" id="fecha" required />
        <label>
          <input type="checkbox" id="esPagoMensual" />
          ¿Es pago mensual?
        </label>
        <label>
          <input type="checkbox" id="esEvento" />
          ¿Es evento?
        </label>        
        <div id="productos">
          <div class="producto">
            <div class="inputs-container">
              <input
                type="text"
                placeholder="Producto"
                class="producto-nombre"
                required
                oninput="mostrarSugerencias(this)"
              />
              <div class="sugerencias"></div>
              <input
                type="number"
                placeholder="Precio"
                class="producto-precio"
                required
                step="0.01"
                min="0"
                inputmode="decimal"
                autocomplete="off"
                onwheel="this.blur()"
                aria-label="Precio (usa punto o coma)"
              />
              <input
                type="text"
                placeholder="Descripción (opcional)"
                class="producto-desc"
              />
            </div>
            <button
              type="button"
              class="eliminar-producto"
              onclick="eliminarProducto(this)"
            >
              ❌
            </button>
          </div>
        </div>
        <button type="button" onclick="agregarProducto()">
          Agregar otro producto
        </button>
        <button type="submit">Guardar Lista</button>
      </form>
    </section>

    <!-- Sección Consultar por Tienda -->
    <section id="consultar" class="seccion oculto">
      <h2>🔎 Consultar Compras</h2>
      <div style="display: flex; flex-direction: column; gap: 0.5em;">
        <input type="text" id="filtroTienda" placeholder="Buscar por tienda..." />
        <input
          type="text"
          id="filtroProducto"
          placeholder="Buscar por producto..."
        />
        <label for="ordenarPor">Ordenar por:</label>
        <select id="ordenarPor">
          <option value="">-- Seleccionar --</option>
          <option value="precio">Precio</option>
          <option value="nombre">Nombre</option>
        </select>
      </div>
      <div id="contadorResultados" style="margin-top: 0.5em; font-weight: bold;"></div>
      <ul id="listaResultados"></ul>
    </section>

    <!-- Sección Ver Listas -->
    <section id="verListas" class="seccion oculto">
      <h2>Listas completas por fecha y lugar</h2>
        <div style="margin-bottom:0.5em; display: flex; flex-direction: column; gap: 8px;">
          <div style="display: flex; gap: 8px;">
            <input
              type="text"
              id="filtroLugarListas"
              placeholder="🔍 Buscar lista para editar..."
              oninput="mostrarListasFirebase(true)"
              style="flex: 1;"
            />
            <select id="ordenarListasPor" onchange="mostrarListasFirebase(true)" style="width: auto; flex: 0 0 140px;">
              <option value="fechaDesc" selected>📅 Nuevas</option>
              <option value="fechaAsc">📅 Antiguas</option>
              <option value="alphaAsc">🔤 A - Z</option>
              <option value="alphaDesc">🔤 Z - A</option>
            </select>
          </div>

          <div style="display: flex; gap: 8px;">
            <input
              type="text"
              id="rangoFechasListas"
              placeholder="Rango de fechas"
              aria-label="Rango de fechas"
              style="flex: 1;"
            />
            <button type="button" id="btnLimpiarFechas" onclick="limpiarFechasListas()" class="btn">
              Limpiar
            </button>
          </div>

          <input type="date" id="fechaDesdeListas" style="display:none" onchange="mostrarListasFirebase(true)"/>
          <input type="date" id="fechaHastaListas" style="display:none" onchange="mostrarListasFirebase(true)"/>

          <div class="segmented" id="filtroEstadoListas" role="group" style="margin-top:6px;">
            <button type="button" id="btnTodas" class="seg-btn active">Todas</button>
            <button type="button" id="btnPendientes" class="seg-btn">Pendientes</button>
          </div>
        </div>
      <!-- Export/Import backup -->
      <div style="display:flex; gap:8px; margin:.5rem 0;">
        <button class="btn" onclick="exportarJSON()">
          <i class="fa-solid fa-file-export" aria-hidden="true"></i> Exportar
        </button>

        <label class="btn" style="cursor:pointer;">
          <i class="fa-solid fa-file-import" aria-hidden="true"></i> Importar
          <input
            type="file"
            accept="application/json"
            style="display:none"
            onchange="importarJSON(this.files[0]); this.value='';"
            aria-label="Seleccionar archivo JSON para importar"
          >
        </label>
      </div>
      <ul id="todasLasListas"></ul>
      <button id="btnCargarMas" onclick="cargarMasListas()" style="display:none; margin-top: 10px;">
        Mostrar otros 5
      </button>
    </section>    

    <!-- Sección Notificaciones (con filtro "Hasta fecha") -->
    <section id="notificaciones" class="seccion oculto">
      <h2>🔔 Notificaciones de Pagos</h2>

      <!-- Controles de filtro -->
      <div id="notifsFilterBar" style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px;">
        <label style="font-weight:700; color:#374151;">
          Mostrar pagos hasta:
          <input id="notifsFilterDate" type="date" style="margin-left:8px; padding:6px; border-radius:6px; border:1px solid #e6e9ef;" />
        </label>
        <button id="btnApplyNotifsFilter" style="padding:8px 10px; border-radius:8px; background:#1976d2; color:#fff; border:none; cursor:pointer; font-weight:700;">Aplicar filtro</button>
        <button id="btnClearNotifsFilter" style="padding:8px 10px; border-radius:8px; background:#e2e8f0; color:#111; border:none; cursor:pointer; font-weight:700;">Limpiar</button>
        <div id="notifsFilterHint" style="color:#6b7280; font-size:0.9rem; margin-left:8px;">(Desde hoy hasta la fecha seleccionada)</div>
      </div>

      <!-- Resumen / Totales calculados -->
      <div id="notifsSummaryContainer"></div>

      <!-- Lista de notificaciones (renderizada por JS) -->
      <ul id="listaNotificaciones"></ul>
    </section>
    
    <!-- Sección Eventos -->
    <section id="eventos" class="seccion oculto">
      <h2>📅 Eventos</h2>

      <!-- Filtros: lugar + rango de fechas -->
      <div style="margin-bottom:0.5em;">
        <input
          type="text"
          id="filtroLugarEventos"
          placeholder="Filtrar por lugar..."
          oninput="refrescarEventosFiltrados(true)"
        />

        <!-- Rango (Flatpickr) -->
        <input
          type="text"
          id="rangoFechasEventos"
          placeholder="Rango de fechas"
          aria-label="Rango de fechas (inicio y fin)"
          style="max-width:240px;"
        />

        <!-- Inputs ocultos que usa la lógica JS -->
        <input
          type="date"
          id="fechaDesdeEventos"
          aria-label="Desde"
          onchange="refrescarEventosFiltrados(true)"
          style="display:none"
        />
        <input
          type="date"
          id="fechaHastaEventos"
          aria-label="Hasta"
          onchange="refrescarEventosFiltrados(true)"
          style="display:none"
        />

        <button type="button" id="btnLimpiarFechasEventos" onclick="limpiarFechasEventos()">
          Limpiar fechas
        </button>
      </div>

      <ul id="listaEventos"></ul>
    </section>

  </main>

  <div id="mensaje" class="mensaje oculto" role="status" aria-live="polite"></div>

  <!-- Flatpickr para el rango de fechas -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/es.js"></script>  

  <script type="module" src="./script.js"></script>
</body>
</html>
